[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrest-report-agent"
version = "0.1.0"
description = "Discord agent for reviewing roleplay arrest reports."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
arrest-report-agent = "arrest_report_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arrest_report_agent = [
    "config/data/*.json",
    "config/assets/*.png",
    "config/personas/*.json",
    "config/personas/assets/*.png",
    "config/personas/assets/*.jpg",
    "config/personas/assets/*.jpeg",
    "config/personas/assets/*.gif",
    "knowledge/data/*.json",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ai_eval: live evaluation that calls the configured OpenAI model and consumes credits",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["arrest_report_agent"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["discord", "discord.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncpg", "boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arrest_report_agent.infrastructure.discord.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["arrest_report_agent.role_requests.discord", "arrest_report_agent.pagers.discord"]
ignore_errors = true
