[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrest-report-agent"
version = "0.1.0"
description = "Discord agent for reviewing roleplay arrest reports."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai-agents~=0.19.0",
    "py-cord~=2.8.0",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
arrest-report-agent = "arrest_report_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arrest_report_agent = ["knowledge/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["arrest_report_agent"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["discord", "discord.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arrest_report_agent.infrastructure.discord.*"]
ignore_errors = true

