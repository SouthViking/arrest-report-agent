name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a controlled CI failure for notification QA
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/arrest_report_agent_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Simulate controlled CI failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "::error::Controlled CI failure requested for notification QA"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Start isolated PostgreSQL with registry fallback
        run: python scripts/ci_containers.py postgres

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest -q

      - name: PostgreSQL diagnostics
        if: failure()
        run: docker logs arrest-report-agent-ci-postgres || true

      - name: Remove isolated PostgreSQL
        if: always()
        run: docker rm --force arrest-report-agent-ci-postgres || true

  container:
    name: Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build runtime image
        run: python3 scripts/ci_containers.py build --tag arrest-report-agent:${{ github.sha }}
